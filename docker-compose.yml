services:
  app:
    build: .
    container_name: klatzmeister
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4002
    ports:
      - "127.0.0.1:4002:4002"
    volumes:
      # counter page views, biar nggak reset pas rebuild
      - ./.data:/app/.data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
